<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16192B"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#F4D35E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F4D35E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect x="14" y="14" width="472" height="472" rx="16" fill="none" stroke="#00E5FF" stroke-width="3"/>
  <rect x="26" y="26" width="448" height="448" rx="10" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
  <circle cx="250" cy="200" r="140" fill="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="200" y="130" width="100" height="140" rx="10" fill="#F4D35E"/>
  <text x="250" y="400" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#F2F3F7" text-anchor="middle" font-weight="bold">YELLOW CARD</text>
  <text x="250" y="430" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#00E5FF" text-anchor="middle">FANCHAIN COLLECTIBLE</text>
</svg>